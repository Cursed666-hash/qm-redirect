<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Redirecting to QuarterMaster…</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #14170f; color: #d2dcbe; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  .card { background: #1a1d14; border: 1px solid #323824; padding: 24px; border-radius: 12px; text-align: center; max-width: 420px; width: 90%; }
  h1 { margin: 0 0 8px; font-size: 20px; color: #f0b23c; }
  p { margin: 0 0 16px; font-size: 14px; color: #a8b98c; line-height: 1.5; }
  .url { word-break: break-all; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; color: #64e6a2; margin-bottom: 16px; }
  .spinner { width: 28px; height: 28px; border: 3px solid #2d351f; border-top-color: #f0b23c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #64e6a2; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1>Redirecting to QuarterMaster…</h1>
  <p id="msg">Loading tunnel address…</p>
  <div class="url" id="url">—</div>
  <p id="fallback" style="display:none">Not redirected automatically? <a id="link" target="_blank" rel="noopener">Click here</a></p>
</div>
<script>
(function(){
  var jsonUrl = 'redirect.json?v=' + Date.now();
  var maxRetries = 5;
  var delayMs = 1500;
  function attempt(n){
    fetch(jsonUrl, {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('bad status '+r.status); return r.json(); })
      .then(function(data){
        var target = data && data.url ? data.url : null;
        var elMsg = document.getElementById('msg');
        var elUrl = document.getElementById('url');
        var elFb = document.getElementById('fallback');
        var elLink = document.getElementById('link');
        if(target){
          elMsg.textContent = 'Redirecting now…';
          elUrl.textContent = target;
          elLink.href = target;
          elFb.style.display = 'block';
          // Small delay so the user can see where they're going, then redirect
          setTimeout(function(){ location.replace(target); }, 1200);
        } else {
          elMsg.textContent = 'No tunnel URL configured yet.';
          elUrl.textContent = '—';
        }
      })
      .catch(function(err){
        if(n < maxRetries){
          setTimeout(function(){ attempt(n+1); }, delayMs);
        } else {
          document.getElementById('msg').textContent = 'Could not load tunnel address. Try again shortly.';
          document.getElementById('url').textContent = err.message;
        }
      });
  }
  attempt(1);
})();
</script>
</body>
</html>
